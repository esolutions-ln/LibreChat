# NMB add-on services. Use alongside the stock LibreChat compose file:
#   docker compose -f docker-compose.yml -f docker-compose.nmb.yml up -d
services:
  nmb-scanner:
    build:
      context: ./nmb-scanner
      # args: { SPACY_MODEL: en_core_web_sm }   # optional NER (also set NMB_SPACY_MODEL)
    container_name: nmb-scanner
    restart: unless-stopped
    environment:
      # Generate once: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      NMB_VAULT_KEY: ${NMB_VAULT_KEY:?set NMB_VAULT_KEY (Fernet key) in .env}
      NMB_SERVICE_KEY: ${NMB_SERVICE_KEY:?set NMB_SERVICE_KEY (shared secret with the gateway) in .env}
      NMB_DATA_DIR: /data
      NMB_POLICY_FILE: /srv/config/policy.yaml
      NMB_BLOCKLIST_FILE: /srv/config/blocklist.yaml
      NMB_SPACY_MODEL: ${NMB_SPACY_MODEL:-}
      NMB_LOG_LEVEL: ${NMB_LOG_LEVEL:-INFO}
    volumes:
      - nmb-scanner-data:/data
      - ./nmb-scanner/config:/srv/config:ro
    expose:
      - "8088"          # internal only: do NOT publish this port; only the gateway should reach it
    # The analysis sandbox runs user-supplied code next to real data. The scanner therefore sits on
    # an internal-only network (no route to the internet) and runs with a reduced privilege set.
    networks:
      - nmb-internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: ${NMB_SCANNER_MEM_LIMIT:-2g}
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,os;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8088/health',headers={'X-NMB-Service-Key':os.environ['NMB_SERVICE_KEY']}))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # LLM egress: LibreChat -> litellm -> provider. LiteLLM holds the provider key and is the only
  # service here with internet access; Presidio masks PII in each prompt before it leaves.
  # Point LibreChat at it with a custom endpoint (baseURL http://litellm:4000/v1,
  # apiKey ${LITELLM_MASTER_KEY}); see docs/nmb/LITELLM.md.
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_TAG:-main-stable}   # pin a version in production
    container_name: nmb-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_UPSTREAM_MODEL: ${LITELLM_UPSTREAM_MODEL:?set LITELLM_UPSTREAM_MODEL in .env}
      LITELLM_UPSTREAM_API_KEY: ${LITELLM_UPSTREAM_API_KEY:?set LITELLM_UPSTREAM_API_KEY in .env}
      PRESIDIO_ANALYZER_API_BASE: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_API_BASE: http://presidio-anonymizer:3000
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    expose:
      - "4000"          # internal only: LibreChat reaches it by service name; do not publish
    networks:
      - default         # outbound access to the provider
      - nmb-internal    # reachable from api, and from the Presidio services
    depends_on:
      - presidio-analyzer
      - presidio-anonymizer

  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:${PRESIDIO_TAG:-latest}   # pin a version in production
    container_name: nmb-presidio-analyzer
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - nmb-internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:${PRESIDIO_TAG:-latest}   # pin a version in production
    container_name: nmb-presidio-anonymizer
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      - nmb-internal
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # The gateway reaches the scanner over the internal network. Set NMB_ANALYSIS_ENABLED=true in .env
  # to turn on the synthetic-data analysis workbench (docs/nmb/ANALYSIS.md).
  api:
    networks:
      - default
      - nmb-internal

networks:
  nmb-internal:
    internal: true

volumes:
  nmb-scanner-data:
